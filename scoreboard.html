<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試合速報/試合結果 | 2026年千葉県郵便局長ソフトボール大会</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background: #f5f5f5;
            color: #333;
        }
        
        /* ヘッダー */
        header {
            background: #003366;
            color: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .header-top {
            background: #002244;
            padding: 12px 0;
            font-size: 0.85em;
        }
        
        .header-top-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-logo {
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .header-logo:hover {
            opacity: 0.8;
        }
        
        .header-logo img {
            height: 35px;
            width: auto;
            display: block;
        }
        
        .header-info {
            color: #aaa;
            font-size: 0.9em;
        }
        
        .header-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
        }
        
        .nav-links {
            display: flex;
            gap: 25px;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            padding-bottom: 5px;
        }
        
        .nav-links::-webkit-scrollbar {
            display: none;
        }
        
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 0.95em;
            transition: opacity 0.3s;
            white-space: nowrap;
        }
        
        .nav-links a:hover {
            opacity: 0.7;
        }
        
        .scroll-indicator {
            display: none;
        }
        
        /* メインコンテンツ */
        .page-header {
            background: white;
            border-bottom: 3px solid #003366;
            padding: 40px 20px;
        }
        
        .page-header-content {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .page-title {
            font-size: 2.2em;
            font-weight: 300;
            color: #003366;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .page-subtitle {
            color: #666;
            font-size: 1.1em;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        /* 試合カード */
        .game-section {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .game-section-header {
            background: #003366;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .game-title {
            font-size: 1.3em;
            font-weight: bold;
        }
        
        .status-badge {
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .status-badge.playing {
            background: #ff6b6b;
            color: white;
            animation: pulse 2s infinite;
        }
        
        .status-badge.waiting {
            background: rgba(255,255,255,0.2);
            color: white;
        }
        
        .status-badge.finished {
            background: #2ecc71;
            color: white;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        /* スコアボード - 修正箇所 */
        .scoreboard {
            overflow-x: auto;
            padding: 20px;
            position: relative;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }
        
        th, td {
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        th {
            background: #f8f8f8;
            color: #333;
            font-weight: bold;
            font-size: 0.9em;
            white-space: nowrap;
        }
        
        td {
            background: white;
            font-size: 1.1em;
        }
        
        /* 🔧 修正: チーム名列の固定とz-index調整 */
        .team-name {
            text-align: left;
            font-weight: bold;
            color: #333;
            width: 120px;
            min-width: 120px;
            padding: 12px 15px;
            position: sticky;
            left: 0;
            background: white;
            z-index: 99; /* z-indexを上げて確実に上に表示 */
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        
        /* 🔧 修正: ヘッダーのチーム列もz-indexを調整 */
        th.team-header {
            position: sticky;
            left: 0;
            background: #f8f8f8;
            z-index: 100; /* ヘッダーは更に上に */
            box-shadow: 2px 0 5px rgba(0,0,0,0.1);
        }
        
        .score-zero {
            color: #999;
        }
        
        .score-positive {
            color: #003366;
            font-weight: bold;
        }
        
        .score-empty {
            color: #ddd;
        }
        
        .total {
            background: #fff3cd !important;
            font-weight: bold;
            font-size: 1.4em;
            color: #856404;
        }
        
        /* 待機中・試合中メッセージ */
        .status-message {
            padding: 60px 20px;
            text-align: center;
        }
        
        .status-message-icon {
            font-size: 4em;
            margin-bottom: 20px;
        }
        
        .status-message-text {
            font-size: 1.3em;
            color: #666;
            margin-bottom: 10px;
        }
        
        .status-message-subtext {
            font-size: 1em;
            color: #999;
        }
        
        /* ローディング */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid #003366;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 更新ボタン */
        .refresh-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #003366;
            color: white;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s;
            z-index: 100;
        }
        
        .refresh-btn:hover:not(:disabled) {
            transform: scale(1.1);
            background: #004080;
        }
        
        .refresh-btn:disabled {
            opacity: 0.5;
        }
        
        /* フッター */
        footer {
            background: #002244;
            color: white;
            padding: 20px;
            margin-top: 60px;
            text-align: center;
        }
        
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .copyright {
            font-size: 0.85em;
            opacity: 0.6;
        }
        
        /* レスポンシブ */
        @media (max-width: 768px) {
            .header-main {
                position: relative;
                overflow: hidden;
            }
            
            .nav-links {
                width: 100%;
                justify-content: flex-start;
                padding-bottom: 5px;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                flex-wrap: nowrap;
            }
            
            .nav-links a {
                flex-shrink: 0;
            }
            
            .scroll-indicator {
                display: flex;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                height: 47px;
                width: 30px;
                align-items: center;
                justify-content: center;
                font-size: 1.2em;
                color: white;
                background-color: #003366;
                cursor: pointer;
                z-index: 10;
            }
            
            .page-title {
                font-size: 1.6em;
            }
            
            .game-section-header {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            th, td {
                padding: 10px 6px;
                font-size: 0.9em;
            }
            
            .team-name {
                min-width: 80px;
                font-size: 0.9em;
            }
            
            th.team-header {
                min-width: 80px;
            }
            
            .total {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <div class="header-top-content">
                <a href="#" onclick="goBack(); return false;" class="header-logo">
                    <img src="https://drive.google.com/thumbnail?id=1i01jLSCnme9KdDuBwL8MufLNGdeo_d0x" alt="全国郵便局長会">
                </a>
                <div class="header-info">
                    2026年千葉県郵便局長ソフトボール大会 | 2026.6.6
                </div>
            </div>
        </div>
        <div class="header-main">
            <nav class="nav-links" id="navLinks">
                <a href="#" onclick="openPage('scoreboard.html'); return false;">試合速報 / 試合結果</a>
                <a href="#" onclick="openPage('schedule.html'); return false;">大会スケジュール</a>
                <a href="#" onclick="openPage('tournament.html'); return false;">トーナメント表</a>
                <a href="#" onclick="openPage('teams.html'); return false;">チーム・選手一覧</a>
                <a href="#" onclick="openPage('venue.html'); return false;">会場案内・アクセス</a>
                <a href="#" onclick="openPage('rules.html'); return false;">大会ルール・規約</a>
                <a href="#" onclick="openPage('history.html'); return false;">優勝記録・歴史</a>
            </nav>
            <div class="scroll-indicator" id="scrollIndicator">▶︎</div>
        </div>
    </header>
    
    <div class="page-header">
        <div class="page-header-content">
            <h1 class="page-title">試合速報 / 試合結果</h1>
            <p class="page-subtitle">Live Score & Results</p>
        </div>
    </div>
    
    <div class="container" id="content">
        <div class="loading">
            <div class="loading-spinner"></div>
            <div>データを読み込んでいます...</div>
        </div>
    </div>
    
    <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄</button>
    
    <footer>
        <div class="footer-content">
            <div class="copyright">
                © 2025 Softball Tournament. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const API_URL = urlParams.get('api') || '';
        
        let isRefreshing = false;
        let scheduleData = {};
        
        // 時刻フォーマット関数
        function formatTime(timeValue) {
            if (!timeValue) return '';
            
            if (typeof timeValue === 'number') {
                const totalMinutes = Math.round(timeValue * 24 * 60);
                const hours = Math.floor(totalMinutes / 60);
                const minutes = totalMinutes % 60;
                return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            }
            
            if (typeof timeValue === 'string') {
                if (timeValue.includes('T')) {
                    try {
                        const date = new Date(timeValue);
                        const jstDate = new Date(date.getTime() + (9 * 60 * 60 * 1000));
                        const hours = jstDate.getUTCHours();
                        const minutes = jstDate.getUTCMinutes();
                        return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
                    } catch (e) {
                        console.error('時刻パースエラー:', e);
                    }
                }
                
                if (/^\d{1,2}:\d{2}$/.test(timeValue)) {
                    const [h, m] = timeValue.split(':');
                    return `${String(h).padStart(2, '0')}:${m}`;
                }
                
                return timeValue;
            }
            
            return '';
        }
        
        async function fetchScores() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch(`${API_URL}?t=${timestamp}`, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                const scheduleResponse = await fetch(`${API_URL}?type=schedule&t=${timestamp}`, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });
                
                if (scheduleResponse.ok) {
                    const scheduleJson = await scheduleResponse.json();
                    if (scheduleJson.schedule) {
                        scheduleData = scheduleJson.schedule.reduce((acc, s) => {
                            acc[s.gameNum] = {
                                court: s.court,
                                time: s.time,
                                team1: s.team1,
                                team2: s.team2
                            };
                            return acc;
                        }, {});
                    }
                }
                
                displayAllGames(data);
            } catch (error) {
                console.error('データ取得エラー:', error);
                document.getElementById('content').innerHTML = 
                    `<div class="loading">データの読み込みに失敗しました</div>`;
            }
        }
        
        async function manualRefresh() {
            if (isRefreshing) return;
            
            isRefreshing = true;
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            
            await fetchScores();
            
            setTimeout(() => {
                isRefreshing = false;
                btn.disabled = false;
            }, 2000);
        }
        
        function displayAllGames(data) {
            if (!data.games || data.games.length === 0) {
                document.getElementById('content').innerHTML = 
                    '<div class="loading">試合データがありません</div>';
                return;
            }
            
            const gameGroups = {};
            data.games.forEach(game => {
                const key = `${game.court}-${game.gameNum}`;
                if (!gameGroups[key]) {
                    gameGroups[key] = {
                        court: game.court,
                        gameNum: game.gameNum,
                        status: game.status || '待機',
                        teams: []
                    };
                }
                gameGroups[key].teams.push(game);
            });
            
            const sortedGames = Object.values(gameGroups).sort((a, b) => a.gameNum - b.gameNum);
            
            let html = '';
            
            sortedGames.forEach(gameData => {
                const statusClass = gameData.status === '試合中' ? 'playing' :
                                   gameData.status === '終了' ? 'finished' : 'waiting';
                
                let specialLabel = '';
                if (gameData.court === 'B' && gameData.gameNum === 6) {
                    specialLabel = ' <span style="color: #ffc107;">🥉 3位決定戦</span>';
                } else if (gameData.court === 'A' && gameData.gameNum === 7) {
                    specialLabel = ' <span style="color: #ffd700;">🏆 決勝戦</span>';
                }
                
                html += `
                    <div class="game-section">
                        <div class="game-section-header">
                            <div class="game-title">${gameData.court}コート 第${gameData.gameNum}試合${specialLabel}</div>
                            <div class="status-badge ${statusClass}">${gameData.status}</div>
                        </div>
                `;
                
                if (gameData.status === '待機' && (!gameData.teams[0].innings || gameData.teams[0].innings.every(s => s === null || s === undefined || s === ''))) {
                    const schedule = scheduleData[gameData.gameNum];
                    const startTime = schedule ? formatTime(schedule.time) : '';
                    
                    html += `
                        <div class="status-message">
                            <div class="status-message-icon">⏰</div>
                            <div class="status-message-text">${startTime ? startTime + ' 開始予定' : 'まだ試合が始まっていません'}</div>
                            <div class="status-message-subtext">${gameData.teams[0].team} vs ${gameData.teams[1].team}</div>
                        </div>
                    `;
                } else {
                    const team1 = gameData.teams[0];
                    const team2 = gameData.teams[1];
                    const inningsCount = team1.innings ? team1.innings.length : 0;
                    
                    html += `
                        <div class="scoreboard">
                            <table>
                                <thead>
                                    <tr>
                                        <th class="team-header">チーム</th>`;
                    
                    for (let i = 1; i <= inningsCount; i++) {
                        html += `<th>${i}</th>`;
                    }
                    
                    html += `<th>合計</th>
                                    </tr>
                                </thead>
                                <tbody>`;
                    
                    gameData.teams.forEach(team => {
                        html += `
                            <tr>
                                <td class="team-name">${team.team}</td>`;
                        
                        for (let i = 0; i < inningsCount; i++) {
                            const score = team.innings[i];
                            
                            if (score === null || score === undefined || score === '') {
                                html += `<td class="score-empty">-</td>`;
                            } else if (score === 0) {
                                html += `<td class="score-zero">0</td>`;
                            } else {
                                html += `<td class="score-positive">${score}</td>`;
                            }
                        }
                        
                        html += `<td class="total">${team.total || 0}</td>
                            </tr>`;
                    });
                    
                    html += `
                                </tbody>
                            </table>
                        </div>`;
                    
                    if (gameData.status === '試合中') {
                        html += `
                            <div class="status-message" style="padding: 20px;">
                                <div class="status-message-text" style="font-size: 1.1em;">⚾ 試合中</div>
                            </div>
                        `;
                    }
                }
                
                html += `</div>`;
            });
            
            document.getElementById('content').innerHTML = html;
        }
        
        function goBack() {
            window.location.href = 'index.html';
        }
        
        function openPage(page) {
            window.location.href = page;
        }
        
        function openScoresPage() {
            window.location.href = 'scoreboard.html';
        }
        
        fetchScores();
        setInterval(fetchScores, 60000);
        
        const navLinks = document.getElementById('navLinks');
        const scrollIndicator = document.getElementById('scrollIndicator');
        
        function updateScrollIndicator() {
            if (!navLinks || !scrollIndicator) return;
            
            const maxScroll = navLinks.scrollWidth - navLinks.clientWidth;
            const currentScroll = navLinks.scrollLeft;
            
            if (maxScroll <= 0) {
                scrollIndicator.style.display = 'none';
                return;
            }
            
            scrollIndicator.style.display = 'flex';
            
            if (currentScroll > 5) {
                scrollIndicator.textContent = '◀︎';
                scrollIndicator.style.left = '0';
                scrollIndicator.style.right = 'auto';
            } else if (currentScroll < maxScroll - 5) {
                scrollIndicator.textContent = '▶︎';
                scrollIndicator.style.left = 'auto';
                scrollIndicator.style.right = '0';
            } else {
                scrollIndicator.style.display = 'none';
            }
        }
        
        if (navLinks) {
            navLinks.addEventListener('scroll', updateScrollIndicator);
            window.addEventListener('resize', updateScrollIndicator);
            updateScrollIndicator();
        }
        
        if (scrollIndicator) {
            scrollIndicator.addEventListener('click', () => {
                const scrollAmount = 200;
                if (scrollIndicator.textContent === '▶︎') {
                    navLinks.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                } else {
                    navLinks.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                }
            });
        }
    </script>
</body>
</html>
