<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ソフトボール大会 スコアボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Kaku Gothic Pro', 'メイリオ', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .header-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }
        
        .update-time {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .refresh-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: all 0.3s;
        }
        
        .refresh-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }
        
        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .courts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 30px;
        }
        
        .court {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .court-header {
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }
        
        .game {
            margin-bottom: 30px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .game-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            margin-left: 10px;
        }
        
        .status.playing {
            background: #ff6b6b;
            color: white;
        }
        
        .status.waiting {
            background: #95a5a6;
            color: white;
        }
        
        .status.finished {
            background: #2ecc71;
            color: white;
        }
        
        .scoreboard {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            min-width: 600px;
        }
        
        th, td {
            padding: 12px 8px;
            text-align: center;
            border: 1px solid #ddd;
        }
        
        th {
            background: #667eea;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            white-space: nowrap;
        }
        
        td {
            background: white;
            font-size: 1.1em;
        }
        
        .team-name {
            text-align: left;
            font-weight: bold;
            color: #333;
            position: sticky;
            left: 0;
            background: white;
            z-index: 1;
        }
        
        .score-zero {
            color: #333;
            font-weight: normal;
        }
        
        .score-positive {
            color: #333;
            font-weight: bold;
        }
        
        .score-empty {
            color: #bbb;
        }
        
        .total {
            background: #fff3cd !important;
            font-weight: bold;
            font-size: 1.3em;
            color: #856404;
            position: sticky;
            right: 0;
            z-index: 1;
        }
        
        .no-games {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.2em;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.5em;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .courts {
                grid-template-columns: 1fr;
            }
            
            th, td {
                padding: 8px 4px;
                font-size: 0.9em;
            }
            
            .game-title {
                font-size: 1.1em;
            }
            
            .header-controls {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚾ ソフトボール大会 ⚾</h1>
            <div class="header-controls">
                <div class="update-time" id="updateTime">読み込み中...</div>
                <button class="refresh-btn" id="refreshBtn" onclick="manualRefresh()">🔄 更新</button>
            </div>
        </header>
        
        <div class="courts" id="courts">
            <div class="loading">データを読み込んでいます...</div>
        </div>
    </div>

    <script>
        // URLパラメータからAPIのURLを取得
        const urlParams = new URLSearchParams(window.location.search);
        const API_URL = urlParams.get('api') || localStorage.getItem('STAFF_BOT_API_URL') || '';
        
        // URLパラメータで指定された場合はlocalStorageに保存
        if (urlParams.get('api')) {
            localStorage.setItem('STAFF_BOT_API_URL', urlParams.get('api'));
        }
        
        // APIのURLが設定されていない場合の警告
        if (!API_URL) {
            document.getElementById('courts').innerHTML = `
                <div class="no-games">
                    <h2>⚠️ API URLが設定されていません</h2>
                    <p>以下の形式でアクセスしてください:</p>
                    <code style="background:#f5f5f5;padding:10px;display:block;margin:10px 0;border-radius:5px;">
                        ${window.location.origin}${window.location.pathname}?api=YOUR_API_URL
                    </code>
                    <p style="font-size:0.9em;color:#666;">
                        例: ?api=https://script.google.com/macros/s/AKfycby.../exec
                    </p>
                </div>
            `;
        }
        
        
        let isRefreshing = false;
        let autoRefreshInterval = null;
        
        // データ取得（キャッシュ対策付き）
        async function fetchScores() {
            try {
                // キャッシュ対策: タイムスタンプをクエリパラメータに追加
                const timestamp = new Date().getTime();
                const response = await fetch(`${API_URL}?t=${timestamp}`, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                displayScores(data);
                
                // 最終更新時刻を表示
                document.getElementById('updateTime').textContent = 
                    `最終更新: ${data.lastUpdate}`;
            } catch (error) {
                console.error('データ取得エラー:', error);
                document.getElementById('courts').innerHTML = 
                    `<div class="no-games">データの読み込みに失敗しました<br><small>エラー: ${error.message}</small><br><button class="refresh-btn" onclick="manualRefresh()" style="margin-top:10px;">再試行</button></div>`;
            }
        }
        
        // 手動更新（ボタン連打防止）
        async function manualRefresh() {
            if (isRefreshing) return;
            
            isRefreshing = true;
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.textContent = '🔄 更新中...';
            
            await fetchScores();
            
            // 2秒間ボタンを無効化
            setTimeout(() => {
                isRefreshing = false;
                btn.disabled = false;
                btn.textContent = '🔄 更新';
            }, 2000);
        }
        
        // スコア表示
        function displayScores(data) {
            const courtsDiv = document.getElementById('courts');
            
            if (!data.games || data.games.length === 0) {
                courtsDiv.innerHTML = '<div class="no-games">まだ試合データがありません</div>';
                return;
            }
            
            // コートごとにグループ化（動的に全コートを取得）
            const courtGroups = {};
            data.games.forEach(game => {
                const key = game.court;
                if (!courtGroups[key]) {
                    courtGroups[key] = {};
                }
                if (!courtGroups[key][game.gameNum]) {
                    courtGroups[key][game.gameNum] = [];
                }
                courtGroups[key][game.gameNum].push(game);
            });
            
            // HTML生成
            let html = '';
            
            // 動的にすべてのコートを処理（A, B, C, D...）
            const courts = Object.keys(courtGroups).sort();
            
            courts.forEach(court => {
                html += `<div class="court">
                    <div class="court-header">${court}コート</div>`;
                
                const games = courtGroups[court];
                const gameNums = Object.keys(games).sort((a, b) => a - b);
                
                gameNums.forEach(gameNum => {
                    const teams = games[gameNum];
                    const status = teams[0].status || '待機';
                    
                    let statusClass = 'waiting';
                    if (status === '試合中') statusClass = 'playing';
                    if (status === '終了') statusClass = 'finished';
                    
                    // イニング数を動的に取得（制限なし、最大20回）
                    const inningsCount = teams[0].innings ? teams[0].innings.length : 0;
                    
                    html += `
                        <div class="game">
                            <div class="game-title">
                                第${gameNum}試合
                                <span class="status ${statusClass}">${status}</span>
                            </div>
                            <div class="scoreboard">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>チーム</th>`;
                    
                    // イニングのヘッダーを動的に生成（全イニング表示）
                    for (let i = 1; i <= inningsCount; i++) {
                        html += `<th>${i}</th>`;
                    }
                    
                    html += `<th>合計</th>
                                        </tr>
                                    </thead>
                                    <tbody>`;
                    
                    teams.forEach(team => {
                        html += `
                            <tr>
                                <td class="team-name">${team.team}</td>`;
                        
                        // イニングごとのスコアを動的に表示
                        for (let i = 0; i < inningsCount; i++) {
                            const score = team.innings[i];
                            
                            // スコアの表示ロジック
                            // null, undefined, '' は未到達 → ハイフン
                            // 0 は到達済みで無得点 → 黒字の0
                            // 1以上 は得点あり → 太字
                            
                            if (score === null || score === undefined || score === '') {
                                // 未到達の回はハイフン（薄いグレー）
                                html += `<td class="score-empty">-</td>`;
                            } else if (score === 0) {
                                // 0点は黒字の0（通常フォント）
                                html += `<td class="score-zero">0</td>`;
                            } else {
                                // 得点ありは太字
                                html += `<td class="score-positive">${score}</td>`;
                            }
                        }
                        
                        html += `<td class="total">${team.total || 0}</td>
                            </tr>`;
                    });
                    
                    html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>`;
                });
                
                html += '</div>';
            });
            
            courtsDiv.innerHTML = html || '<div class="no-games">試合データがありません</div>';
        }
        
        // 初回読み込み
        fetchScores();
        
        // 60秒ごとに自動更新
        autoRefreshInterval = setInterval(fetchScores, 60000);
    </script>
</body>
</html>
