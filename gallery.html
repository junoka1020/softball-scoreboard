<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大会写真ギャラリー</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Kaku Gothic Pro', 'メイリオ', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .update-time {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .nav {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .nav a {
            display: inline-block;
            padding: 12px 30px;
            background: white;
            color: #667eea;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            margin: 5px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }
        
        .nav a:hover {
            transform: translateY(-2px);
        }
        
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .photo-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            cursor: pointer;
        }
        
        .photo-card:hover {
            transform: translateY(-5px);
        }
        
        .photo-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }
        
        .photo-info {
            padding: 15px;
            text-align: center;
        }
        
        .photo-time {
            font-size: 1em;
            color: #666;
        }
        
        .photo-author {
            font-size: 0.85em;
            color: #999;
            margin-top: 5px;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: white;
            font-size: 1.5em;
        }
        
        .no-photos {
            text-align: center;
            padding: 60px;
            background: white;
            border-radius: 15px;
            color: #666;
            font-size: 1.3em;
        }
        
        .error-box {
            background: white;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            color: #666;
        }
        
        .error-box h2 {
            color: #ff6b6b;
            margin-bottom: 15px;
        }
        
        .error-box code {
            background: #f5f5f5;
            padding: 10px;
            display: block;
            margin: 10px 0;
            border-radius: 5px;
            word-break: break-all;
        }
        
        /* モーダル */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            max-width: 90%;
            max-height: 90%;
        }
        
        .modal-content img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
        
        .modal-author {
            text-align: center;
            color: white;
            margin-top: 15px;
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .close-modal {
            position: absolute;
            top: 20px;
            right: 40px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }
            
            .photo-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
            
            .photo-card img {
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📸 大会写真ギャラリー 📸</h1>
            <div class="update-time" id="updateTime">読み込み中...</div>
        </header>
        
        <div class="nav">
            <a href="#" onclick="goBack(); return false;">← スコアボードに戻る</a>
        </div>
        
        <div class="photo-grid" id="photoGrid">
            <div class="loading">写真を読み込んでいます...</div>
        </div>
    </div>
    
    <!-- モーダル -->
    <div class="modal" id="modal">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <div class="modal-content">
            <img id="modalImage" src="" alt="写真">
            <div class="modal-author" id="modalAuthor"></div>
        </div>
    </div>

    <script>
        // URLパラメータからAPIのURLを取得
        const urlParams = new URLSearchParams(window.location.search);
        const API_URL = urlParams.get('api') || localStorage.getItem('AUDIENCE_BOT_API_URL') || '';
        
        // URLパラメータで指定された場合はlocalStorageに保存
        if (urlParams.get('api')) {
            localStorage.setItem('AUDIENCE_BOT_API_URL', urlParams.get('api'));
        }
        
        console.log('API URL:', API_URL);
        
        // APIのURLが設定されていない場合の警告
        if (!API_URL) {
            document.getElementById('photoGrid').innerHTML = `
                <div class="error-box">
                    <h2>⚠️ API URLが設定されていません</h2>
                    <p>以下の形式でアクセスしてください:</p>
                    <code>${window.location.origin}${window.location.pathname}?api=YOUR_API_URL</code>
                    <p style="font-size:0.9em;color:#666;margin-top:10px;">
                        例: ?api=https://script.google.com/macros/s/AKfycby.../exec
                    </p>
                </div>
            `;
        }
        
        // 写真データ取得
        async function fetchPhotos() {
            if (!API_URL) return;
            
            try {
                const timestamp = new Date().getTime();
                const fetchUrl = `${API_URL}?t=${timestamp}`;
                console.log('Fetching from:', fetchUrl);
                
                const response = await fetch(fetchUrl, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-cache'
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Data received:', data);
                
                displayPhotos(data);
                
                const photoCount = data.photos ? data.photos.length : 0;
                document.getElementById('updateTime').textContent = 
                    `最終更新: ${data.lastUpdate || '不明'} | 投稿枚数: ${photoCount}枚`;
            } catch (error) {
                console.error('データ取得エラー:', error);
                document.getElementById('photoGrid').innerHTML = `
                    <div class="error-box">
                        <h2>⚠️ 写真の読み込みに失敗しました</h2>
                        <p>エラー詳細: ${error.message}</p>
                        <p style="margin-top:10px;">API URL: <code>${API_URL}</code></p>
                        <p style="font-size:0.9em;color:#666;margin-top:10px;">
                            ・API URLが正しいか確認してください<br>
                            ・ネットワーク接続を確認してください<br>
                            ・開発者ツールのコンソールでエラーを確認してください
                        </p>
                    </div>
                `;
            }
        }
        
        // 写真表示
        function displayPhotos(data) {
            const grid = document.getElementById('photoGrid');
            
            if (!data.photos || data.photos.length === 0) {
                grid.innerHTML = `
                    <div class="no-photos">
                        まだ写真が投稿されていません<br>
                        <span style="font-size:0.8em;margin-top:10px;display:block;">
                            LINE Botに写真を送信すると、ここに表示されます
                        </span>
                    </div>
                `;
                return;
            }
            
            let html = '';
            data.photos.forEach(photo => {
                const userName = photo.userName || '投稿者';
                html += `
                    <div class="photo-card" onclick='openModal(${JSON.stringify(photo.fullImage)}, ${JSON.stringify(userName)})'>
                        <img src="${photo.thumbnail}" alt="大会写真" loading="lazy" onerror="this.src='${photo.fullImage}'">
                        <div class="photo-info">
                            <div class="photo-time">📷 ${photo.timestamp}</div>
                            <div class="photo-author">撮影者: ${userName}</div>
                        </div>
                    </div>
                `;
            });
            
            grid.innerHTML = html;
        }
        
        // モーダル表示
        function openModal(imageUrl, userName) {
            document.getElementById('modalImage').src = imageUrl;
            document.getElementById('modalAuthor').textContent = `撮影者: ${userName}`;
            document.getElementById('modal').classList.add('active');
        }
        
        // モーダル閉じる
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }
        
        // 戻るボタン
        function goBack() {
            const params = new URLSearchParams();
            if (API_URL) params.set('api', API_URL);
            window.location.href = `index.html?${params.toString()}`;
        }
        
        // Escキーでモーダルを閉じる
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });
        
        // モーダル背景クリックで閉じる
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target.id === 'modal') closeModal();
        });
        
        // 初回読み込み
        fetchPhotos();
        
        // 30秒ごとに自動更新
        setInterval(fetchPhotos, 30000);
    </script>
</body>
</html>
